executive_assessment:
  verdict: "promising_and_worth_investing"
  thesis: >
    Gentle Facts is already a credible versioned evidence index for declarations,
    signatures, imports, commit/tree impact, historical snapshots and compact
    agent context. Its strongest next step is to become the invalidation and
    provenance layer for reusable execution proofs, while first making its own
    freshness path much cheaper.
  strategic_positioning: >
    The differentiated product should be an agent-oriented evidence system:
    Facts answers what is known about a repository and where that knowledge came
    from; a new proof layer answers what has already been demonstrated about that
    exact state, why the proof is still valid, what invalidated it, and the
    minimum verification required to regain confidence.
