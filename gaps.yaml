product_opportunity:
  differentiation: >
    Avoid positioning the system as another generic task cache like Nx/Turborepo.
    The stronger differentiator is explainable, provenance-rich evidence for
    autonomous agents: what is known, what was proven, why it is still valid,
    exactly what changed, and the minimum work needed to restore certainty.
  quality_gain: >
    The same machinery that saves time can improve quality because it makes
    verification state explicit, forces input modeling, preserves provenance,
    identifies stale evidence and enables targeted re-verification instead of
    informal agent assumptions.
  time_saving_gain: >
    The largest expected wins come from removing repeated Facts freshness work,
    deduplicating concurrent identical commands, and re-running only affected
    tests rather than entire suites.
  long_term_vision: >
    A repository-local evidence graph combining structural facts, contracts,
    change impact, execution proofs and runtime-observed dependencies can become
    a durable shared memory of engineering certainty across agents and sessions.

risks_and_guardrails:
  - risk: "Watcher events can be lost."
    guardrail: "Periodic/full Git reconciliation remains authoritative."
  - risk: "Static dependency graphs miss runtime/dynamic coupling."
    guardrail: "Unknown coupling forces broader execution; runtime tracing may refine later."
  - risk: "E2E depends on mutable external state."
    guardrail: "No strong reuse unless that state is modeled; otherwise short TTL or execute."
  - risk: "Environment fingerprint leaks secrets."
    guardrail: "Never persist secret plaintext; use local keyed digests/version IDs if needed."
  - risk: "Cached failure amplifies flakes."
    guardrail: "Short retention, flake classification and rerun/quorum policy."
  - risk: "Proof reuse hides required side effects."
    guardrail: "Explicit command side-effect classes; reuse only safe validation semantics."
  - risk: "Cross-process cache coherence becomes complex."
    guardrail: "Immutable artifacts plus generation pointer remain authoritative."
  - risk: "Optimization weakens existing snapshot integrity."
    guardrail: "Fast paths are bypassable; full reconciliation must remain testable and equivalent."
  - risk: "Synthetic benchmarks overstate savings."
    guardrail: "Use real-repository p50/p95/p99 and phase-level measurements."
  - risk: "Overly aggressive minimum-test selection misses regressions."
    guardrail: "Conservative fallback and explicit confidence thresholds."

what_not_to_do:
  - "Do not cache raw stdout and treat it as proof."
  - "Do not key reuse only by command string."
  - "Do not wait for a regression before invalidating after a relevant modification."
  - "Do not treat absence of a Facts edge as proof of runtime independence."
  - "Do not reuse uncontrolled remote E2E as if it were hermetic."
  - "Do not silently skip commands with side effects."
  - "Do not distribute proof caches before local correctness and provenance are mature."
  - "Do not claim billed-token or production-SLA savings from current synthetic benchmarks."

closure_criteria_for_future_implementation:
  - "Facts repeated-query fast path is measurably cheaper on the actual repository."
  - "No regression in snapshot integrity, writer safety, cancellation or external-edit detection."
  - "Identical concurrent proof requests execute once."
  - "Relevant source/config/toolchain/runtime changes invalidate before reuse."
  - "Selective verification never composes a green suite from stale constituents."
  - "Every reused result is explainable with provenance and invalidation inputs."
  - "E2E reuse is disabled when hermeticity cannot be demonstrated."
  - "Observed wall-clock savings are reported alongside false-reuse rate and fallback rate."
